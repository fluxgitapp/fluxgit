<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle - dark -->
  <circle cx="256" cy="256" r="256" fill="#0D1117"/>

  <!-- Outer ring segments (like GitHub Actions workflow nodes) -->
  <!-- Top arc segment -->
  <path d="M256 48 A208 208 0 0 1 464 256" fill="none" stroke="#06B6D4" stroke-width="18" stroke-linecap="round"/>
  <!-- Right arc segment -->
  <path d="M464 256 A208 208 0 0 1 256 464" fill="none" stroke="#0891B2" stroke-width="18" stroke-linecap="round"/>
  <!-- Bottom arc segment -->
  <path d="M256 464 A208 208 0 0 1 48 256" fill="none" stroke="#0E7490" stroke-width="18" stroke-linecap="round"/>
  <!-- Left arc segment -->
  <path d="M48 256 A208 208 0 0 1 256 48" fill="none" stroke="#164E63" stroke-width="18" stroke-linecap="round"/>

  <!-- Connector dots on the ring (workflow nodes) -->
  <circle cx="256" cy="48"  r="14" fill="#06B6D4"/>
  <circle cx="464" cy="256" r="14" fill="#06B6D4"/>
  <circle cx="256" cy="464" r="14" fill="#06B6D4"/>
  <circle cx="48"  cy="256" r="14" fill="#06B6D4"/>

  <!-- Inner gear / hub -->
  <circle cx="256" cy="256" r="88" fill="#0D1117" stroke="#06B6D4" stroke-width="6"/>

  <!-- Git branch icon in center -->
  <!-- Main vertical line -->
  <line x1="256" y1="210" x2="256" y2="302" stroke="#06B6D4" stroke-width="12" stroke-linecap="round"/>
  <!-- Branch line going upper-right -->
  <line x1="256" y1="230" x2="290" y2="210" stroke="#06B6D4" stroke-width="10" stroke-linecap="round"/>
  <!-- Commit nodes -->
  <circle cx="256" cy="210" r="12" fill="#06B6D4"/>
  <circle cx="256" cy="302" r="12" fill="#06B6D4"/>
  <circle cx="290" cy="210" r="10" fill="#0891B2" stroke="#06B6D4" stroke-width="3"/>

  <!-- Spark / lightning bolt (AI indicator) top-right quadrant -->
  <polygon points="310,148 298,178 312,178 300,208 326,170 310,170" fill="#F59E0B" opacity="0.9"/>

  <!-- Small orbit dots (workflow steps) -->
  <circle cx="352" cy="160" r="8" fill="#06B6D4" opacity="0.6"/>
  <circle cx="352" cy="352" r="8" fill="#06B6D4" opacity="0.6"/>
  <circle cx="160" cy="352" r="8" fill="#06B6D4" opacity="0.6"/>
  <circle cx="160" cy="160" r="8" fill="#06B6D4" opacity="0.6"/>

  <!-- Connecting lines from orbit dots to ring -->
  <line x1="352" y1="160" x2="390" y2="122" stroke="#06B6D4" stroke-width="3" opacity="0.4"/>
  <line x1="352" y1="352" x2="390" y2="390" stroke="#06B6D4" stroke-width="3" opacity="0.4"/>
  <line x1="160" y1="352" x2="122" y2="390" stroke="#06B6D4" stroke-width="3" opacity="0.4"/>
  <line x1="160" y1="160" x2="122" y2="122" stroke="#06B6D4" stroke-width="3" opacity="0.4"/>
</svg>
